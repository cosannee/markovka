<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Марковка</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#faf8f4;
  --bg2:#f2ece2;
  --bg3:#e8dfd2;
  --card:#ffffff;
  --accent:#b8733e;
  --accent2:#d4935f;
  --accent-bg:#fdf2e9;
  --text1:#1e1710;
  --text2:#5c4a38;
  --text3:#9e8878;
  --border:#e2d8cc;
  --border2:#cec0b0;
  --green:#4a7c5e;--green-bg:#eaf3ed;
  --blue:#3d6498;--blue-bg:#edf2f9;
  --red:#9e4040;--red-bg:#faeaea;
  --orange:#b8733e;--orange-bg:#fdf2e9;
  --purple:#6b52a0;--purple-bg:#f2eefa;
  --gray:#7a7570;--gray-bg:#f5f2ef;
  --r:10px;--r2:16px;
  --sh:0 1px 8px rgba(30,23,16,.07);
  --sh2:0 4px 20px rgba(30,23,16,.12);
}
body{font-family:'Golos Text',sans-serif;background:var(--bg);color:var(--text1);font-size:14px;min-height:100vh;overflow-x:hidden}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#faf8f4 0%,#eddfc8 100%)}
.login-wrap{width:100%;max-width:340px;padding:20px}
.login-bear{text-align:center;font-size:52px;margin-bottom:4px}
.login-title{font-family:'Playfair Display',serif;font-size:26px;color:var(--accent);text-align:center;margin-bottom:4px}
.login-sub{text-align:center;font-size:13px;color:var(--text3);margin-bottom:28px}
.role-card{background:var(--card);border-radius:var(--r2);border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .18s;box-shadow:var(--sh)}
.role-card:hover{border-color:var(--accent);box-shadow:var(--sh2);transform:translateY(-1px)}
.role-card:active{transform:scale(.98)}
.role-icon{font-size:28px;width:44px;text-align:center}
.role-name{font-weight:600;font-size:15px;color:var(--text1)}
.role-desc{font-size:12px;color:var(--text3);margin-top:1px}
.role-arrow{margin-left:auto;font-size:18px;color:var(--text3)}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
.app-header{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.h-logo{font-family:'Playfair Display',serif;font-size:18px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px}
.h-role{font-size:11px;color:var(--text3);background:var(--bg2);padding:3px 10px;border-radius:20px;font-weight:500}
.h-right{display:flex;align-items:center;gap:10px}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:6px;border-radius:8px;line-height:1}
.btn-icon:hover{background:var(--bg2)}

.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:0;padding:12px 4px;border:none;background:none;font-family:'Golos Text',sans-serif;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .tab-icon{font-size:16px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.main{padding:14px;flex:1;max-width:600px;width:100%;margin:0 auto}

/* CARDS */
.card{background:var(--card);border-radius:var(--r2);border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden}
.card+.card{margin-top:10px}
.card.urgent{border-left:3px solid var(--red)}

.card-head{padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-num{font-family:'Playfair Display',serif;font-size:14px;color:var(--accent);font-weight:600}
.card-name{font-size:14px;font-weight:600;color:var(--text1);margin-top:1px}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}

.card-body{padding:10px 14px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cf{display:flex;flex-direction:column;gap:1px}
.cf-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.cf-v{font-size:13px;color:var(--text1);font-weight:500}

.card-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-comment{font-size:11px;color:var(--text3);font-style:italic;flex:1}

/* BADGES */
.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.b-new{background:var(--blue-bg);color:var(--blue)}
.b-work{background:var(--orange-bg);color:var(--orange)}
.b-ready{background:var(--green-bg);color:var(--green)}
.b-sent{background:var(--purple-bg);color:var(--purple)}
.b-done{background:var(--gray-bg);color:var(--gray)}
.b-urgent{background:var(--red-bg);color:var(--red)}
.b-paid{background:var(--green-bg);color:var(--green)}
.b-part{background:var(--orange-bg);color:var(--orange)}
.b-sdek{background:var(--blue-bg);color:var(--blue)}
.b-inst{background:#fce8f0;color:#b0366a}
.b-wait{background:var(--blue-bg);color:var(--blue)}
.b-pers{background:var(--purple-bg);color:var(--purple)}
.b-site{background:var(--blue-bg);color:var(--blue)}

/* STATUS SELECT */
.st-select{padding:6px 10px;border-radius:8px;border:1px solid var(--border2);font-family:'Golos Text',sans-serif;font-size:12px;background:var(--bg);color:var(--text1);cursor:pointer;outline:none}

/* BTNS */
.btn{padding:9px 18px;border-radius:var(--r);border:none;font-family:'Golos Text',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#9e6234}
.btn-secondary{background:var(--bg2);color:var(--text2);border:1px solid var(--border2)}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-full{width:100%;justify-content:center}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text3)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid #f0c0c0}

/* FILTERS */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--card);font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.search-inp{padding:7px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--card);font-family:'Golos Text',sans-serif;font-size:13px;color:var(--text1);outline:none;flex:1;min-width:120px}
.search-inp:focus{border-color:var(--accent)}

/* FORM */
.form-section{background:var(--card);border-radius:var(--r2);border:1px solid var(--border);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.form-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--text1);margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fg label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{padding:9px 12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg);font-family:'Golos Text',sans-serif;font-size:13px;color:var(--text1);outline:none;transition:border-color .15s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}
.fg textarea{resize:vertical;min-height:60px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.span2{grid-column:span 2}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:6px 0}
.checkbox-row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:var(--r2);padding:14px;border:1px solid var(--border);box-shadow:var(--sh)}
.stat-val{font-family:'Playfair Display',serif;font-size:26px;color:var(--accent);font-weight:600}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px}

/* ALERT */
.alert{padding:10px 12px;border-radius:var(--r);font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.alert-red{background:var(--red-bg);color:var(--red)}
.alert-orange{background:var(--orange-bg);color:var(--orange)}

/* CALENDAR */
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--border)}
.cal-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--text1)}
.cal-btn{background:none;border:1px solid var(--border2);border-radius:8px;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--text2);transition:all .15s}
.cal-btn:hover{background:var(--accent-bg);border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dh{text-align:center;padding:7px 2px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;background:var(--bg2);border-bottom:1px solid var(--border)}
.cal-cell{min-height:64px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;position:relative}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.other{background:var(--bg2)}
.cal-cell.today{background:var(--accent-bg)}
.cal-dn{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:2px}
.cal-cell.today .cal-dn{color:var(--accent)}
.cal-dot{display:block;font-size:9px;padding:1px 4px;border-radius:3px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-weight:500}
.cal-month-orders{padding:14px;border-top:1px solid var(--border)}
.cal-mo-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.cal-mo-num{font-weight:600;color:var(--accent);min-width:46px}
.cal-mo-toy{color:var(--text2);flex:1}
.cal-mo-master{color:var(--text3);font-size:11px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(30,23,16,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
@media(min-width:600px){.modal{border-radius:20px;margin:auto}}
.modal-title{font-family:'Playfair Display',serif;font-size:17px;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:16px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text1);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* SYNC indicator */
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:8px}
.section-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;margin-top:4px}

@media(max-width:400px){
  .form-grid{grid-template-columns:1fr}
  .span2{grid-column:span 1}
  .stats-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- LOGIN / AUTH SCREEN -->
<div id="login">
  <div class="login-wrap">
    <div class="login-bear">🐻</div>
    <div class="login-title">Марковка</div>
    <div class="login-sub" id="login-sub">Определяем аккаунт...</div>
    <div id="login-error" style="display:none;background:#faeaea;color:#9e4040;border-radius:12px;padding:16px;text-align:center;font-size:13px;line-height:1.6;margin-top:8px"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="h-logo">🐻 Марковка</div>
    <div class="h-right">
      <span title="Синхронизация активна"><span class="sync-dot"></span></span>
      <span id="h-user-name" style="font-size:12px;color:var(--text2);font-weight:600"></span>
      <div class="h-role" id="h-role-lbl"></div>
      <button class="btn-icon" onclick="logout()" title="Выйти">✕</button>
    </div>
  </div>
  <div class="tabs" id="tabs-bar"></div>
  <div class="main" id="main"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATUSES={
  new:{label:'🟡 Новый',cls:'b-new'},
  work:{label:'🔵 В работе',cls:'b-work'},
  ready:{label:'🟢 Готов',cls:'b-ready'},
  sent:{label:'📦 Отправлен',cls:'b-sent'},
  done:{label:'✅ Доставлен',cls:'b-done'},
};
const SOURCES={
  waiting:{label:'Лист ожидания',cls:'b-wait'},
  instagram:{label:'Instagram',cls:'b-inst'},
  personal:{label:'Личный',cls:'b-pers'},
  site:{label:'Сайт',cls:'b-site'},
};
const MASTERS=['Даша','Света'];

// ── TELEGRAM ROLE MAP ──
// Каждый Telegram user_id жёстко привязан к одной роли
const ROLE_MAP = {
  '461599258':  { role: 'manager', name: 'Александра', label: '👩‍💼 Менеджер',    masterName: null },
  '5158981366': { role: 'director', name: 'Даша',       label: '🏠 Руководитель', masterName: null },
  '5273106995': { role: 'master',   name: 'Света',      label: '🧵 Мастер',       masterName: 'Света' },
};

let role=null,masterName=null,tab='list',fStatus='all',fMonth='all',fMaster='all',search='',calDate=new Date();

// ── STORAGE (JSONBin.io — общее облако для всех) ──
const JSONBIN_ID  = '6a209043f5f4af5e29b48f00';
const JSONBIN_KEY = '$2a$10$A3Zv7sJYjph22m6ZEvB5CeHxn5CBix9MSEQI7K5c313H0OAdZveeG';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

async function loadOrders(){
  try{
    const r=await fetch(JSONBIN_URL+'/latest',{
      headers:{'X-Master-Key':JSONBIN_KEY,'X-Bin-Meta':'false'}
    });
    if(!r.ok) throw new Error('fetch failed');
    const data=await r.json();
    return Array.isArray(data.orders)?data.orders:null;
  }catch(e){
    try{const d=localStorage.getItem('markovka_orders');return d?JSON.parse(d):null;}catch(e2){return null;}
  }
}

async function saveOrders(ords){
  try{localStorage.setItem('markovka_orders',JSON.stringify(ords));}catch(e){}
  try{
    await fetch(JSONBIN_URL,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY,'X-Bin-Meta':'false'},
      body:JSON.stringify({orders:ords})
    });
  }catch(e){console.warn('JSONBin save error',e);}
}

let orders=[];

function seedOrders(){
  const now=new Date(),m=now.getMonth()+1,y=now.getFullYear();
  const mo=`${y}-${String(m).padStart(2,'0')}`;
  const mo2=`${y}-${String(m+1>12?1:m+1).padStart(2,'0')}`;
  return[
    {id:uid(),num:'М-001',client:'Анна Петрова',phone:'+7 900 123-45-67',address:'Москва, Ленина 5',toys:'Мишка 3200г',count:1,price:14000,prepaid:7000,month:mo,master:'Даша',source:'site',status:'work',urgent:false,sdek:false,comment:'Вышивка имени',deliveryDay:12,created:Date.now()-86400000*3},
    {id:uid(),num:'М-002',client:'Мария Сидорова',phone:'+7 911 987-65-43',address:'СПб, Невский 10',toys:'Мишка 2600г',count:1,price:13200,prepaid:0,month:mo,master:'Даша',source:'instagram',status:'new',urgent:true,sdek:false,comment:'Срочно к 15-му!',deliveryDay:15,created:Date.now()-86400000*1},
    {id:uid(),num:'М-003',client:'Елена Козлова',phone:'+7 925 555-11-22',address:'Казань, Баумана 3',toys:'Мишка 4200г',count:1,price:15500,prepaid:15500,month:mo2,master:'Света',source:'waiting',status:'new',urgent:false,sdek:false,comment:'',deliveryDay:5,created:Date.now()-3600000},
    {id:uid(),num:'М-004',client:'Ольга Смирнова',phone:'+7 916 444-33-22',address:'Краснодар, Красная 1',toys:'Мишка 3800г',count:1,price:14800,prepaid:14800,month:mo,master:'Даша',source:'personal',status:'ready',urgent:false,sdek:false,comment:'',deliveryDay:20,created:Date.now()-86400000*5},
  ];
}

function uid(){return '_'+Math.random().toString(36).substr(2,9)}
function genNum(){const n=orders.map(o=>parseInt(o.num.replace('М-',''))||0);return 'М-'+String((n.length?Math.max(...n):0)+1).padStart(3,'0')}
function fmt(n){return(Math.round(n)||0).toLocaleString('ru')+' ₽'}

// ── AUTH via Telegram ──
async function initTelegramAuth(){
  // Пробуем получить данные из Telegram WebApp
  const tg = window.Telegram && window.Telegram.WebApp;
  let tgUserId = null;

  if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user){
    tgUserId = String(tg.initDataUnsafe.user.id);
    tg.ready();
    tg.expand();
  }

  // DEV-режим: если открыто не из Telegram, показываем ошибку
  if(!tgUserId){
    // Попробуем URL-параметр для отладки (только для теста, в продакшене убрать)
    const params = new URLSearchParams(window.location.search);
    tgUserId = params.get('dev_uid');
  }

  if(!tgUserId){
    document.getElementById('login-sub').textContent = '';
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-error').innerHTML =
      '⚠️ Приложение должно открываться через Telegram.<br><br>' +
      'Нажмите кнопку в боте, чтобы войти.';
    return;
  }

  const userInfo = ROLE_MAP[tgUserId];
  if(!userInfo){
    document.getElementById('login-sub').textContent = '';
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-error').innerHTML =
      '🚫 Ваш аккаунт не добавлен в систему.<br><br>' +
      'Обратитесь к администратору.<br>' +
      '<small style="color:#c07070">ID: ' + tgUserId + '</small>';
    return;
  }

  // Всё ок — входим автоматически
  await login(userInfo.role, userInfo.name, userInfo.label, userInfo.masterName);
}

async function login(r, userName, userLabel, mName){
  role = r;
  masterName = mName;
  const loaded = await loadOrders();
  orders = loaded || seedOrders();
  if(!loaded) await saveOrders(orders);
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('h-role-lbl').textContent = userLabel;
  document.getElementById('h-user-name').textContent = userName;
  tab = r === 'master' ? 'master' : 'list';
  renderTabs(); renderTab(tab);
  startSync();
}

function logout(){
  clearInterval(syncTimer);
  role = null; masterName = null;
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-sub').textContent = 'Определяем аккаунт...';
  document.getElementById('login-error').style.display = 'none';
  initTelegramAuth();
}

// ── SYNC ──
let syncTimer=null;
function startSync(){
  syncTimer=setInterval(async()=>{
    const loaded=await loadOrders();
    if(loaded){
      const newStr=JSON.stringify(loaded);
      const curStr=JSON.stringify(orders);
      if(newStr!==curStr){orders=loaded;renderTab(tab);}
    }
  },4000);
}

// ── TABS ──
function renderTabs(){
  const bar=document.getElementById('tabs-bar');
  const all=role==='master'
    ?[{id:'master',icon:'📋',label:'Заказы'}]
    :[
      {id:'list',icon:'📋',label:'Заказы'},
      {id:'calendar',icon:'📅',label:'Календарь'},
      {id:'add',icon:'➕',label:'Добавить'},
      ...(role==='manager'?[{id:'stats',icon:'📊',label:'Итоги'}]:[]),
    ];
  bar.innerHTML=all.map(t=>`<button class="tab ${tab===t.id?'active':''}" onclick="renderTab('${t.id}')"><span class="tab-icon">${t.icon}</span>${t.label}</button>`).join('');
}
function renderTab(t){tab=t;renderTabs();document.getElementById('main').innerHTML=
  t==='list'?tplList():t==='calendar'?tplCalendar():t==='add'?tplAdd():t==='stats'?tplStats():tplMaster();
}

// ── LIST ──
function tplList(){
  const months=[...new Set(orders.map(o=>o.month))].sort();
  let list=orders.filter(o=>{
    if(fStatus!=='all'&&o.status!==fStatus)return false;
    if(fMonth!=='all'&&o.month!==fMonth)return false;
    if(fMaster!=='all'&&o.master!==fMaster)return false;
    if(search){const q=search.toLowerCase();if(!o.num.toLowerCase().includes(q)&&!(o.client||'').toLowerCase().includes(q)&&!o.toys.toLowerCase().includes(q))return false;}
    return true;
  }).sort((a,b)=>b.created-a.created);

  const moLbl=m=>{if(!m)return'';const[y,mo]=m.split('-');return new Date(y,mo-1).toLocaleString('ru',{month:'long',year:'numeric'})};

  return`<input class="search-inp" style="width:100%;margin-bottom:10px" placeholder="🔍 Поиск по номеру, клиенту..." oninput="search=this.value;renderTab('list')" value="${search}">
  <div class="filters">
    <button class="chip ${fStatus==='all'?'active':''}" onclick="fStatus='all';renderTab('list')">Все статусы</button>
    ${Object.entries(STATUSES).map(([k,v])=>`<button class="chip ${fStatus===k?'active':''}" onclick="fStatus='${k}';renderTab('list')">${v.label}</button>`).join('')}
  </div>
  <div class="filters">
    <button class="chip ${fMonth==='all'?'active':''}" onclick="fMonth='all';renderTab('list')">Все месяцы</button>
    ${months.map(m=>`<button class="chip ${fMonth===m?'active':''}" onclick="fMonth='${m}';renderTab('list')">${moLbl(m)}</button>`).join('')}
    <button class="chip ${fMaster==='all'?'active':''}" onclick="fMaster='all';renderTab('list')">Все мастера</button>
    ${MASTERS.map(m=>`<button class="chip ${fMaster===m?'active':''}" onclick="fMaster='${m}';renderTab('list')">${m}</button>`).join('')}
  </div>
  ${list.length===0?`<div class="empty"><div class="empty-icon">🧸</div>Заказов не найдено</div>`
  :list.map(o=>orderCard(o)).join('')}`;
}

function orderCard(o){
  const st=STATUSES[o.status]||STATUSES.new;
  const src=SOURCES[o.source]||SOURCES.site;
  const paid=o.prepaid>=o.price&&o.price>0;
  const isManager=role==='manager';
  const canEdit=role==='manager'||role==='director';
  const[yr,mo]=(o.month||'').split('-');
  const moStr=yr?new Date(yr,mo-1).toLocaleString('ru',{month:'long',year:'numeric'}):'—';
  return`<div class="card ${o.urgent?'urgent':''}" id="c-${o.id}">
  <div class="card-head">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="card-num">${o.num}</span>
        <span class="badge ${st.cls}">${st.label}</span>
        ${o.urgent?'<span class="badge b-urgent">⚡ Срочно</span>':''}
        ${paid?'<span class="badge b-paid">💰 Оплачен</span>':o.prepaid>0?'<span class="badge b-part">💳 Аванс</span>':''}
        <span class="badge ${src.cls}">${src.label}</span>
        ${o.sdek?'<span class="badge b-sdek">📦 СДЭК</span>':''}
      </div>
      ${isManager?`<div class="card-name">${o.client}</div>`:''}
    </div>
    ${canEdit?`<div style="display:flex;gap:5px">
      <button class="btn btn-sm btn-secondary" onclick="openEdit('${o.id}')">✏️</button>
      <button class="btn btn-sm btn-danger" onclick="delOrder('${o.id}')">🗑</button>
    </div>`:''}
  </div>
  <div class="card-body">
    <div class="cf"><span class="cf-l">Игрушка</span><span class="cf-v">${o.toys}</span></div>
    <div class="cf"><span class="cf-l">Кол-во</span><span class="cf-v">${o.count} шт.</span></div>
    <div class="cf"><span class="cf-l">Месяц</span><span class="cf-v">${moStr}</span></div>
    <div class="cf"><span class="cf-l">Мастер</span><span class="cf-v">${o.master||'—'}</span></div>
    ${isManager?`
    <div class="cf"><span class="cf-l">Цена</span><span class="cf-v">${fmt(o.price)}</span></div>
    <div class="cf"><span class="cf-l">Предоплата</span><span class="cf-v" style="color:${paid?'var(--green)':'var(--orange)'}">${fmt(o.prepaid)}</span></div>
    <div class="cf"><span class="cf-l">Остаток</span><span class="cf-v" style="color:${paid?'var(--text3)':'var(--red)'}">${fmt(Math.max(0,o.price-o.prepaid))}</span></div>
    `:''}
  </div>
  <div class="card-foot">
    <div class="card-comment">${o.comment||''}</div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <select class="st-select" onchange="setStatus('${o.id}',this.value)">
        ${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}"${o.status===k?' selected':''}>${v.label}</option>`).join('')}
      </select>
      ${canEdit&&!o.sdek?`<button class="btn btn-sm btn-secondary" onclick="markSdek('${o.id}')">📦 СДЭК ✓</button>`:''}
    </div>
  </div>
</div>`;
}

// ── CALENDAR ──
function tplCalendar(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const moStr=new Date(y,m).toLocaleString('ru',{month:'long',year:'numeric'});
  const first=new Date(y,m,1).getDay();
  const start=first===0?6:first-1;
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const today=new Date();
  const moKey=`${y}-${String(m+1).padStart(2,'0')}`;
  const moOrders=orders.filter(o=>o.month===moKey);
  const colors={new:'#3d6498',work:'#b8733e',ready:'#4a7c5e',sent:'#6b52a0',done:'#7a7570'};

  let cells='';
  for(let i=0;i<start;i++)cells+=`<div class="cal-cell other"><span class="cal-dn">${prevDays-start+i+1}</span></div>`;
  for(let d=1;d<=days;d++){
    const isT=d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
    const dayOs=moOrders.filter(o=>(o.deliveryDay||0)===d);
    const dots=dayOs.map(o=>{const c=colors[o.status]||colors.work;return`<span class="cal-dot" style="background:${c}22;color:${c}" onclick="jumpTo('${o.id}')">${o.num}</span>`}).join('');
    cells+=`<div class="cal-cell${isT?' today':''}"><span class="cal-dn">${d}</span>${dots}</div>`;
  }
  const rem=(start+days)%7;
  for(let i=1;i<=(rem?7-rem:0);i++)cells+=`<div class="cal-cell other"><span class="cal-dn">${i}</span></div>`;

  const moRows=moOrders.length?moOrders.map(o=>`<div class="cal-mo-row">
    <span class="cal-mo-num">${o.num}</span>
    <span class="cal-mo-toy">${o.toys}${o.urgent?' ⚡':''}</span>
    <span class="badge ${(STATUSES[o.status]||STATUSES.new).cls}" style="font-size:9px">${(STATUSES[o.status]||STATUSES.new).label}</span>
    <span class="cal-mo-master">${o.master}</span>
  </div>`).join(''):`<div style="padding:12px;text-align:center;font-size:13px;color:var(--text3)">Нет заказов</div>`;

  return`<div class="card" style="margin-bottom:12px">
  <div class="cal-header">
    <button class="cal-btn" onclick="calNav(-1)">←</button>
    <div class="cal-title" style="text-transform:capitalize">${moStr}</div>
    <button class="cal-btn" onclick="calNav(1)">→</button>
  </div>
  <div class="cal-grid">
    ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="cal-dh">${d}</div>`).join('')}
    ${cells}
  </div>
  <div class="cal-month-orders">
    <div class="section-lbl">Заказы этого месяца — ${moOrders.length}</div>
    ${moRows}
  </div>
</div>`;
}
function calNav(d){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+d,1);renderTab('calendar')}
function jumpTo(id){fStatus='all';fMonth='all';search='';renderTab('list');setTimeout(()=>{const el=document.getElementById('c-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--accent)';setTimeout(()=>el.style.outline='',2000)}},80)}

// ── ADD FORM ──
function tplAdd(){
  const now=new Date();
  const dm=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  return`<div class="form-section">
  <div class="form-title">➕ Новый заказ</div>
  <div class="form-grid">
    <div class="fg span2"><label>Имя клиента</label><input id="fc" placeholder="Анна Петрова"></div>
    <div class="fg"><label>Телефон</label><input id="fp" type="tel" placeholder="+7 900 000-00-00"></div>
    <div class="fg"><label>Город и адрес</label><input id="fa" placeholder="Москва, ул. Ленина 1"></div>
    <div class="fg span2"><label>Игрушка (тип, вес)</label><input id="ft" placeholder="Мишка 3200г"></div>
    <div class="fg"><label>Количество</label><input id="fct" type="number" min="1" value="1"></div>
    <div class="fg"><label>Цена (₽)</label><input id="fpr" type="number" placeholder="14000"></div>
    <div class="fg"><label>Предоплата (₽)</label><input id="fpre" type="number" value="0"></div>
    <div class="fg"><label>Месяц производства</label><input id="fm" type="month" value="${dm}"></div>
    <div class="fg"><label>Мастер</label><select id="fmas">${MASTERS.map(m=>`<option>${m}</option>`).join('')}</select></div>
    <div class="fg"><label>Источник</label><select id="fsrc">${Object.entries(SOURCES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div>
    <div class="fg"><label>Статус</label><select id="fst">${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div>
    <div class="fg"><label>День сдачи (число)</label><input id="fdd" type="number" min="1" max="31" placeholder="15"></div>
  </div>
  <label class="checkbox-row"><input type="checkbox" id="fur"> ⚡ Срочный заказ (доплата)</label>
  <label class="checkbox-row"><input type="checkbox" id="fsd"> 📦 Накладная СДЭК создана</label>
  <div class="fg" style="margin-top:8px"><label>Комментарий</label><textarea id="fcm" placeholder="Вышивка имени, пожелания..."></textarea></div>
  <button class="btn btn-primary btn-full" style="margin-top:4px" onclick="addOrder()">💾 Сохранить заказ</button>
</div>`;
}

async function addOrder(){
  const c=v('fc'),t=v('ft');
  if(!c||!t){toast('⚠️ Укажите клиента и игрушку');return;}
  const o={id:uid(),num:genNum(),client:c,phone:v('fp'),address:v('fa'),toys:t,
    count:parseInt(v('fct'))||1,price:parseFloat(v('fpr'))||0,prepaid:parseFloat(v('fpre'))||0,
    month:v('fm'),master:v('fmas'),source:v('fsrc'),status:v('fst'),
    deliveryDay:parseInt(v('fdd'))||0,
    urgent:document.getElementById('fur').checked,sdek:document.getElementById('fsd').checked,
    comment:v('fcm'),created:Date.now()};
  orders.unshift(o);
  await saveOrders(orders);
  toast(`✅ Заказ ${o.num} добавлен`);
  renderTab('list');
}

// ── EDIT MODAL ──
function openEdit(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const el=document.createElement('div');
  el.className='modal-bg';el.id='edit-modal';
  el.innerHTML=`<div class="modal">
  <div class="modal-title">✏️ Редактировать ${o.num}</div>
  <div class="form-grid">
    <div class="fg span2"><label>Клиент</label><input id="ec" value="${o.client}"></div>
    <div class="fg"><label>Телефон</label><input id="ep" value="${o.phone||''}"></div>
    <div class="fg"><label>Адрес</label><input id="ea" value="${o.address||''}"></div>
    <div class="fg span2"><label>Игрушка</label><input id="et" value="${o.toys}"></div>
    <div class="fg"><label>Кол-во</label><input id="ect" type="number" value="${o.count}"></div>
    <div class="fg"><label>Цена</label><input id="epr" type="number" value="${o.price}"></div>
    <div class="fg"><label>Предоплата</label><input id="epre" type="number" value="${o.prepaid}"></div>
    <div class="fg"><label>Месяц</label><input id="em" type="month" value="${o.month}"></div>
    <div class="fg"><label>Мастер</label><select id="emas">${MASTERS.map(m=>`<option ${o.master===m?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="fg"><label>Источник</label><select id="esrc">${Object.entries(SOURCES).map(([k,v])=>`<option value="${k}"${o.source===k?' selected':''}>${v.label}</option>`).join('')}</select></div>
    <div class="fg"><label>Статус</label><select id="est">${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}"${o.status===k?' selected':''}>${v.label}</option>`).join('')}</select></div>
    <div class="fg"><label>День сдачи</label><input id="edd" type="number" min="1" max="31" value="${o.deliveryDay||''}"></div>
  </div>
  <label class="checkbox-row"><input type="checkbox" id="eur"${o.urgent?' checked':''}> ⚡ Срочный</label>
  <label class="checkbox-row"><input type="checkbox" id="esd"${o.sdek?' checked':''}> 📦 СДЭК создана</label>
  <div class="fg" style="margin-top:8px"><label>Комментарий</label><textarea id="ecm">${o.comment||''}</textarea></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
    <button class="btn btn-primary" onclick="saveEdit('${o.id}')">💾 Сохранить</button>
  </div>
</div>`;
  document.body.appendChild(el);
  el.addEventListener('click',e=>{if(e.target===el)closeModal()});
}
function closeModal(){const m=document.getElementById('edit-modal');if(m)m.remove()}

async function saveEdit(id){
  const i=orders.findIndex(x=>x.id===id);if(i<0)return;
  orders[i]={...orders[i],client:v('ec'),phone:v('ep'),address:v('ea'),toys:v('et'),
    count:parseInt(v('ect'))||1,price:parseFloat(v('epr'))||0,prepaid:parseFloat(v('epre'))||0,
    month:v('em'),master:v('emas'),source:v('esrc'),status:v('est'),
    deliveryDay:parseInt(v('edd'))||0,
    urgent:document.getElementById('eur').checked,sdek:document.getElementById('esd').checked,
    comment:v('ecm')};
  await saveOrders(orders);closeModal();toast('✅ Сохранено');renderTab(tab);
}

// ── ACTIONS ──
async function setStatus(id,st){
  const o=orders.find(x=>x.id===id);
  if(o){o.status=st;await saveOrders(orders);renderTab(tab);toast(`${STATUSES[st].label}`)}
}
async function markSdek(id){
  const o=orders.find(x=>x.id===id);
  if(o){o.sdek=true;await saveOrders(orders);renderTab(tab);toast('📦 СДЭК отмечена')}
}
async function delOrder(id){
  if(!confirm('Удалить заказ?'))return;
  orders=orders.filter(x=>x.id!==id);
  await saveOrders(orders);renderTab(tab);toast('🗑 Удалён');
}

// ── STATS ──
function tplStats(){
  const tot=orders.length,inW=orders.filter(o=>o.status==='work').length;
  const rdy=orders.filter(o=>o.status==='ready').length;
  const urg=orders.filter(o=>o.urgent).length;
  const rev=orders.reduce((s,o)=>s+o.price,0);
  const pre=orders.reduce((s,o)=>s+o.prepaid,0);
  const noPre=orders.filter(o=>o.prepaid===0).length;
  const noSdek=orders.filter(o=>!o.sdek&&(o.status==='ready'||o.status==='work')).length;
  return`
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val">${tot}</div><div class="stat-lbl">Всего заказов</div></div>
    <div class="stat-card"><div class="stat-val">${inW}</div><div class="stat-lbl">В работе</div></div>
    <div class="stat-card"><div class="stat-val">${rdy}</div><div class="stat-lbl">Готовы</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--red)">${urg}</div><div class="stat-lbl">Срочных</div></div>
    <div class="stat-card"><div class="stat-val" style="font-size:18px">${fmt(rev)}</div><div class="stat-lbl">Сумма заказов</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--green);font-size:18px">${fmt(pre)}</div><div class="stat-lbl">Предоплачено</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--orange);font-size:18px">${fmt(rev-pre)}</div><div class="stat-lbl">К доплате</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--red)">${noPre}</div><div class="stat-lbl">Без предоплаты</div></div>
  </div>
  ${noSdek>0?`<div class="alert alert-orange">📦 ${noSdek} заказов без накладной СДЭК (готовы/в работе)</div>`:''}
  ${noPre>0?`<div class="alert alert-red">💸 ${noPre} заказов без предоплаты</div>`:''}
  ${urg>0?`<div class="alert alert-red">⚡ ${urg} срочных заказов</div>`:''}
  <div class="card" style="padding:14px;margin-top:4px">
    <div class="section-lbl">По мастерам</div>
    ${MASTERS.map(m=>{const mo=orders.filter(o=>o.master===m);return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">
      <span style="font-weight:600">🧵 ${m}</span>
      <span style="color:var(--text3)">${mo.length} заказов</span>
      <span style="color:var(--accent);font-weight:600">${fmt(mo.reduce((s,o)=>s+o.price,0))}</span>
    </div>`}).join('')}
  </div>`;
}

// ── MASTER VIEW ──
function tplMaster(){
  // Мастер видит только свои заказы (фильтр по имени мастера)
  const myOrders = masterName
    ? orders.filter(o => o.master === masterName)
    : orders;
  const active=myOrders.filter(o=>o.status!=='done'&&o.status!=='sent')
    .sort((a,b)=>{const r={work:0,ready:1,new:2};return(r[a.status]??3)-(r[b.status]??3)});
  if(!active.length)return`<div class="empty"><div class="empty-icon">🎉</div>Нет активных заказов</div>`;
  const inW=active.filter(o=>o.status==='work').length;
  const rdy=active.filter(o=>o.status==='ready').length;
  return`<div class="stats-grid" style="margin-bottom:12px">
    <div class="stat-card"><div class="stat-val">${inW}</div><div class="stat-lbl">В работе</div></div>
    <div class="stat-card"><div class="stat-val">${rdy}</div><div class="stat-lbl">Готовы</div></div>
  </div>
  ${active.map(o=>{
    const st=STATUSES[o.status]||STATUSES.new;
    const[yr,mo]=(o.month||'').split('-');
    const moStr=yr?new Date(yr,mo-1).toLocaleString('ru',{month:'long'}):'—';
    return`<div class="card ${o.urgent?'urgent':''}" style="margin-bottom:10px">
      <div class="card-head" style="padding:12px 14px">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="card-num">${o.num}</span>
            <span class="badge ${st.cls}">${st.label}</span>
            ${o.urgent?'<span class="badge b-urgent">⚡ Срочно</span>':''}
          </div>
          <div style="font-size:15px;font-weight:600;margin-top:4px">🧸 ${o.toys}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">${o.count} шт. · ${moStr}${o.deliveryDay?` · сдать ${o.deliveryDay}-го`:''}</div>
          ${o.comment?`<div style="font-size:12px;color:var(--text3);font-style:italic;margin-top:4px">💬 ${o.comment}</div>`:''}
        </div>
      </div>
      <div class="card-foot">
        <span></span>
        <select class="st-select" style="width:100%" onchange="setStatus('${o.id}',this.value)">
          ${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}"${o.status===k?' selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
    </div>`;
  }).join('')}`;
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
